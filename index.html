<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Homie Stream</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;

      border-radius: 12px;

</head>
<body>
  <video id="video" controls autoplay></video>
  <script>
    const streamURL = `https://jcevents.hotstar.com/bpk-tv/f0e3e64ae415771d8e460317ce97aa5e/Fallback/index2.m3u8?cookie=hdntl=exp=1749010889~acl=%2f*~id=33ea318fc781e004cd3aa41798cfe29f~data=hdntl~hmac=6b17d358b531860736dc68ef085720baa34abfb10bc443730f069f89f63386e5&user-agent=Hotstar;in.startv.hotstar/25.02.24.8.11169%20(Android/15)`;

    const video = document.getElementById('video');

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(streamURL);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamURL;
    } else {
      alert('Your browser does not support HLS streaming.');
    }
